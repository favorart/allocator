name: CI

# Documentation-only changes do not run CI (such a PR is merged with --admin).
on:
  push:
    branches: [ "master" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "docs/**" ]

permissions:
  contents: read

# A new push to a PR cancels its previous run; master runs always finish (they tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A push to master is released: the build jobs pack what they built
# (the header and the static library), the release job only collects it.
env:
  RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  linux:
    name: linux (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++, clang++ ]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: ${{ env.RELEASE == 'true' && '0' || '1' }} # tags, for the version
    - name: version
      if: env.RELEASE == 'true'
      shell: bash
      run: echo "ALLOCATOR_VERSION=$(bash .github/next-tag.sh | sed 's/^v//')" >> "$GITHUB_ENV"
    - name: install GoogleTest
      # the runner's package index is usually fresh enough; update only if it is not
      run: |
        sudo apt-get install -y --no-install-recommends libgtest-dev ||
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtest-dev; }
    - name: build (-Wall -Wextra -Wpedantic -Werror)
      run: make -j all
    - name: tests
      run: make test
    - name: tests under ASan + UBSan
      # ASan of older clang crashes at startup with high ASLR entropy (kernel 6.x)
      run: |
        sudo sysctl -w vm.mmap_rnd_bits=28
        make sanitize
    - name: demo
      run: make demo
    - name: benchmark
      if: env.RELEASE == 'true'
      run: make bench
    - name: pack
      if: env.RELEASE == 'true' && matrix.cxx == 'g++'
      run: |
        cmake -S . -B build-pkg -DCMAKE_BUILD_TYPE=Release -DALLOCATOR_BUILD_TESTS=OFF
        cmake --build build-pkg --target allocator -j
        sh .github/pack.sh build-pkg
    - uses: actions/upload-artifact@v5
      if: env.RELEASE == 'true' && matrix.cxx == 'g++'
      with:
        name: allocator-${{ runner.os }}
        path: allocator-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: ${{ env.RELEASE == 'true' && '0' || '1' }} # tags, for the version
    - name: version
      if: env.RELEASE == 'true'
      shell: bash
      run: echo "ALLOCATOR_VERSION=$(bash .github/next-tag.sh | sed 's/^v//')" >> "$GITHUB_ENV"
    # no system GoogleTest on Windows: CMake downloads and builds it, the cache keeps it
    - uses: actions/cache@v6
      with:
        path: build/_deps
        key: deps-${{ runner.os }}-msvc-${{ hashFiles('CMakeLists.txt') }}
    - name: configure
      run: cmake -S . -B build -DALLOCATOR_BUILD_BENCH=ON
    - name: build (/W4 /WX)
      run: cmake --build build --config Release -j
    - name: tests
      run: ctest --test-dir build -C Release --output-on-failure
    - name: benchmark
      if: env.RELEASE == 'true'
      run: build/Release/allocator_bench
    - name: pack
      if: env.RELEASE == 'true'
      shell: bash
      run: sh .github/pack.sh build
    - uses: actions/upload-artifact@v5
      if: env.RELEASE == 'true'
      with:
        name: allocator-${{ runner.os }}
        path: allocator-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  macos:
    name: macos (clang)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: ${{ env.RELEASE == 'true' && '0' || '1' }} # tags, for the version
    - name: version
      if: env.RELEASE == 'true'
      shell: bash
      run: echo "ALLOCATOR_VERSION=$(bash .github/next-tag.sh | sed 's/^v//')" >> "$GITHUB_ENV"
    - name: install GoogleTest
      run: brew install googletest
    - name: configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DALLOCATOR_BUILD_BENCH=ON
    - name: build
      run: cmake --build build -j
    - name: tests
      run: ctest --test-dir build --output-on-failure
    - name: benchmark
      if: env.RELEASE == 'true'
      run: build/allocator_bench
    - name: pack
      if: env.RELEASE == 'true'
      run: sh .github/pack.sh build
    - uses: actions/upload-artifact@v5
      if: env.RELEASE == 'true'
      with:
        name: allocator-${{ runner.os }}
        path: allocator-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  # Tag the master commit with the next patch version: v0.0.1, v0.0.2, ...
  # A minor or major bump is a tag pushed by hand; the numbering continues from it.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: tag
      run: |
        if git tag --points-at HEAD | grep -q '^v[0-9]'; then
          echo "HEAD is already tagged"; exit 0
        fi
        tag=$(bash .github/next-tag.sh) # the version the build jobs packed
        git tag "$tag"
        git push origin "$tag"
        echo "new_tag=$tag" >> "$GITHUB_OUTPUT"

  # GitHub Release for the new tag with the archives packed by the build jobs.
  # Only the 3 latest releases are kept (their tags stay).
  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
    - uses: actions/download-artifact@v5
      with:
        pattern: allocator-*
        merge-multiple: true
    - name: publish
      run: gh release create "$TAG" allocator-*.tar.gz --title "$TAG" --generate-notes
    - name: keep the 3 latest releases
      run: |
        gh release list --limit 100 --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
        while read -r old; do
          gh release delete "$old" --yes
        done
