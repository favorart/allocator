name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

# A new push to a PR cancels its previous run; master runs always finish (they tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++, clang++ ]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@v5
    - name: install GoogleTest
      # the runner's package index is usually fresh enough; update only if it is not
      run: |
        sudo apt-get install -y --no-install-recommends libgtest-dev ||
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtest-dev; }
    - name: build (-Wall -Wextra -Wpedantic -Werror)
      run: make all
    - name: tests
      run: make test
    - name: tests under ASan + UBSan
      # ASan of older clang crashes at startup with high ASLR entropy (kernel 6.x)
      run: |
        sudo sysctl -w vm.mmap_rnd_bits=28
        make sanitize
    - name: demo
      run: make demo
    - name: benchmark
      run: make bench

  windows:
    name: windows (msvc)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    # no system GoogleTest on Windows: CMake downloads and builds it, the cache keeps it
    - uses: actions/cache@v6
      with:
        path: build/_deps
        key: deps-${{ runner.os }}-msvc-${{ hashFiles('CMakeLists.txt') }}
    - name: configure
      run: cmake -S . -B build -DALLOCATOR_BUILD_BENCH=ON
    - name: build (/W4 /WX)
      run: cmake --build build --config Release
    - name: tests
      run: ctest --test-dir build -C Release --output-on-failure
    - name: benchmark
      run: build/Release/allocator_bench

  macos:
    name: macos (clang)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
    - uses: actions/checkout@v5
    - name: install GoogleTest
      run: brew install googletest
    - name: configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DALLOCATOR_BUILD_BENCH=ON
    - name: build
      run: cmake --build build
    - name: tests
      run: ctest --test-dir build --output-on-failure
    - name: benchmark
      run: build/allocator_bench

  # Release binaries of a master commit that passed every check:
  # the header and the static library for each OS.
  package:
    name: package (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ linux, windows, macos ]
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: build the library
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DALLOCATOR_BUILD_TESTS=OFF
        cmake --build build --config Release --target allocator
    - name: pack
      shell: bash
      run: |
        mkdir -p pkg/include pkg/lib
        cp include/allocator.h pkg/include/
        cp LICENSE README.md pkg/
        find build -maxdepth 2 -type f \( -name liballocator.a -o -name allocator.lib \) -exec cp {} pkg/lib/ \;
        test -n "$(ls pkg/lib)"
        tar -czf "allocator-${{ runner.os }}-${{ runner.arch }}.tar.gz" -C pkg .
    - uses: actions/upload-artifact@v5
      with:
        name: allocator-${{ runner.os }}
        path: allocator-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  # Tag the master commit with the next patch version: v0.0.1, v0.0.2, ...
  # A minor or major bump is a tag pushed by hand; the numbering continues from it.
  tag:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: tag
      run: |
        if git tag --points-at HEAD | grep -q '^v[0-9]'; then
          echo "HEAD is already tagged"; exit 0
        fi
        last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
        IFS=. read -r major minor patch <<< "${last#v}"
        tag="v$major.$minor.$((patch + 1))"
        git tag "$tag"
        git push origin "$tag"
        echo "new_tag=$tag" >> "$GITHUB_OUTPUT"

  # GitHub Release for the new tag with the binaries built above.
  # Only the 3 latest releases are kept (their tags stay).
  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
    - uses: actions/download-artifact@v5
      with:
        pattern: allocator-*
        merge-multiple: true
    - name: publish
      run: gh release create "$TAG" allocator-*.tar.gz --title "$TAG" --generate-notes
    - name: keep the 3 latest releases
      run: |
        gh release list --limit 100 --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
        while read -r old; do
          gh release delete "$old" --yes
        done
